; PHP-Einstellungen für die lokale Testumgebung.
;
; Wird in der docker-compose.yml nach /usr/local/etc/php/conf.d/ gehängt.
; upload_max_filesize und post_max_size lassen sich NICHT per ini_set() aus
; WordPress heraus setzen - sie müssen aus einer echten ini-Datei kommen.

file_uploads = On

; Ein einzelnes Foto oder Video. Handy-Videos sprengen 100 MB schnell.
upload_max_filesize = 512M

; Muss größer sein als upload_max_filesize, weil das Formular drumherum
; ebenfalls mitzählt - bei mehreren Dateien in einem Rutsch die Summe.
post_max_size = 640M

; Standard sind 20. Wer abends dreißig Fotos auf einmal auswählt, läuft
; sonst in eine stille Grenze.
max_file_uploads = 60

; Thumbnails aus großen Fotos zu rechnen braucht Speicher.
memory_limit = 512M

; Große Uploads über eine langsame Leitung dürfen dauern.
max_execution_time = 600
max_input_time = 600

; Der Fähnchen-Editor schickt pro Zeile mehrere Felder mit.
max_input_vars = 5000
